LABEL velocity
TEXT HELP
Boot Velocity Linux live. Run `velocity-install` to install,
or `velocity` to explore the customizer.
ENDTEXT
MENU LABEL ^Velocity Linux (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet %KERNEL_PARAMS%

LABEL velocitysafe
TEXT HELP
Boot with conservative kernel options (nomodeset) for troublesome GPUs.
ENDTEXT
MENU LABEL Velocity Linux (%ARCH%, BIOS) ^safe graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%

LABEL velocityspeech
TEXT HELP
Boot with the speakup screen reader enabled.
ENDTEXT
MENU LABEL Velocity Linux (%ARCH%, BIOS) with s^peech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
