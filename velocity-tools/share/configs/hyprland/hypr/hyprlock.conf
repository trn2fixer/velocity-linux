# Velocity · hyprlock
general {
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    path = /usr/share/backgrounds/velocity/wallpaper-night.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(230, 230, 240, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(124, 92, 255, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.25
    outer_color = rgba(124, 92, 255, 1.0)
    inner_color = rgba(11, 11, 18, 0.9)
    font_color = rgba(230, 230, 240, 1.0)
    check_color = rgba(34, 211, 238, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    placeholder_text = <span foreground="##8c8ca0">password</span>
    position = 0, -60
    halign = center
    valign = center
}
