name: Velocity ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Lint scripts and presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: Run checks
        run: bash scripts/check.sh

  build:
    name: Build ISO
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          pacman -Syu --noconfirm --needed archiso git python python-pillow sudo
          bash scripts/build-iso.sh --out "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 14

  boot-test:
    name: Boot ISO in QEMU and run self-test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: velocity-iso
          path: out
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils libarchive-tools genisoimage
          # KVM is available on GitHub-hosted Linux runners; make it usable without sudo.
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM available"; else echo "no KVM, using TCG (slow)"; fi
      - name: Boot and run self-test
        run: bash scripts/boot-test.sh out/velocity-*.iso
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test-logs
          path: out/boot-test/

  release:
    name: Publish release
    needs: [build, boot-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: velocity-iso
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
          generate_release_notes: true
