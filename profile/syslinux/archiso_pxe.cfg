INCLUDE archiso_head.cfg

DEFAULT velocity_nbd
TIMEOUT 150

LABEL velocity_nbd
TEXT HELP
Boot Velocity Linux over the network using NBD.
ENDTEXT
MENU LABEL Velocity Linux (%ARCH%, PXE/NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nbd_srv=${pxeserver} %KERNEL_PARAMS%
SYSAPPEND 3

INCLUDE archiso_tail.cfg
