name: Velocity ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint scripts and presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: Run checks
        run: bash scripts/check.sh

  build:
    name: Build ISO
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          pacman -Syu --noconfirm --needed archiso git python python-pillow sudo
          bash scripts/build-iso.sh --out "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 14
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
          generate_release_notes: true
