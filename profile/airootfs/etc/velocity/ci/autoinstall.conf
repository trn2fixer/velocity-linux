# Unattended install profile used by the CI install test (kernel arg: velocity.autoinstall).
# Targets the first virtio disk of the test VM. Not used on normal boots.
V_DISK=/dev/vda
V_DISK_MODE=wipe
V_ENCRYPT=no
V_HOSTNAME=velocity-test
V_USER=tester
V_USER_PASS=tester
V_ROOT_PASS=''
V_TIMEZONE=UTC
V_LOCALE=en_US.UTF-8
V_KEYMAP=us
V_KERNEL=linux
V_DESKTOP=core
V_BUNDLES=""
V_THEME=night
V_SHELL=zsh
V_AUTOCONFIRM=yes
V_POST_SCRIPT=/etc/velocity/ci/post-install.sh
